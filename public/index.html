<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InsightBoard — визуализация данных</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#e2e5ee;--pri:#4f6df5;--dan:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--tx:#e8ebf2;--mut:#8b93a7;--bd:#2a3140;--pri:#6f86ff}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font-size:18px;margin-right:16px;color:var(--pri)}nav button{background:none;border:0;color:var(--mut);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--pri);color:#fff}.sp{flex:1}main{padding:20px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}.grid .card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{margin:0}.stat span{display:block;color:var(--mut);font-size:13px}.stat strong{display:block;font-size:26px;margin-top:4px}
.dashboard-preview th,.dashboard-preview td{white-space:nowrap}.alert-card{border-color:var(--dan);background:rgba(229,72,77,.08)}
.alert-card li{margin:6px 0}.field{min-width:150px;flex:1}.field input,.field select{width:100%}.thresholds{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
input,select,button.b{padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:14px}
button.b{background:var(--pri);color:#fff;border:0;cursor:pointer}button.b.d{background:var(--dan)}button.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>div{min-width:140px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
h2,h3{margin:0 0 12px}.mut{color:var(--mut);font-size:13px}.auth{max-width:380px;margin:10vh auto}.auth input{width:100%;margin-bottom:10px}
.tag{padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:12px}.cv{position:relative;height:280px}
.hint{margin:8px 0 0}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
</style>
</head>
<body><div id="app"></div>
<script>
const $=selector=>document.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
const EMPTY={users:[],datasets:[],charts:[]};
let db=EMPTY,token='';
try{token=localStorage.getItem('ib_t')||''}catch(error){}
let me=null,view='dash',instances=[];
let builder={type:'bar',agg:'sum',title:'',ds:'',x:'',y:'',ds2:'',x2:'',y2:'',min_value:'',max_value:''};
const COLORS=['#4f6df5','#e5484d','#22c1a0','#f5a623','#9b59f5','#16a8e0','#7cc243','#f06292','#8d6e63','#607d8b'];
const ROLE_LABEL={admin:'Администратор',editor:'Редактор',viewer:'Наблюдатель'};
const TYPE_LABEL={bar:'Столбчатая',line:'Линейная',pie:'Круговая',doughnut:'Кольцевая',scatter:'Точечная'};
const AGG_LABEL={sum:'Сумма',avg:'Среднее',max:'Максимум',count:'Количество'};
const can=permission=>me&&(me.role==='admin'||(permission==='edit'&&me.role==='editor'));
const uid=()=>Math.random().toString(36).slice(2,9);
const isNum=value=>value!==null&&value!==''&&!isNaN(+value);
const fmt=value=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(value);

async function api(method,url,body){
 const response=await fetch(url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined});
 const data=await response.json().catch(()=>({}));
 if(!response.ok){if(response.status===401){token='';me=null;render()}else alert(data.error||'Не удалось выполнить запрос.');throw new Error(data.error||'Ошибка запроса')}
 return data
}
async function refresh(){const state=await api('GET','/api/state');me=state.me;db={users:state.users,datasets:state.datasets,charts:state.charts}}
async function boot(){if(token){try{await refresh()}catch(error){me=null}}render()}

function authView(mode='login',errorMessage=''){
 const login=mode==='login';
 $('#app').innerHTML=`<div class="card auth"><h2>InsightBoard</h2><p class="mut">${login?'Войдите в аккаунт':'Создайте аккаунт (первый пользователь станет администратором)'}</p>
 <input id="u" placeholder="Имя пользователя"><input id="p" type="password" placeholder="Пароль">
 <div style="color:var(--dan);margin-bottom:8px">${errorMessage}</div>
 <button class="b" style="width:100%" id="go">${login?'Войти':'Зарегистрироваться'}</button>
 <p class="mut" style="text-align:center;cursor:pointer" id="sw">${login?'Нет аккаунта? Зарегистрироваться':'Уже есть аккаунт? Войти'}</p></div>`;
 $('#sw').onclick=()=>authView(login?'reg':'login');
 $('#go').onclick=async()=>{
  try{
   const response=await fetch('/api/'+(login?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#u').value.trim(),pass:$('#p').value})});
   const data=await response.json();if(!response.ok)return authView(mode,esc(data.error||'Ошибка'));
   token=data.token;try{localStorage.setItem('ib_t',token)}catch(error){}
   await refresh();view='dash';render()
  }catch(error){authView(mode,'Не удалось связаться с сервером.')}
 }
}

function colType(rows,column){const values=rows.map(row=>row[column]).filter(value=>value!==null&&value!=='');return values.length&&values.filter(isNum).length/values.length>.8?'number':'text'}
function parseFile(file,callback){
 const reader=new FileReader();reader.onload=event=>{try{
  const workbook=XLSX.read(event.target.result,{type:'array',cellDates:true}),sheet=workbook.Sheets[workbook.SheetNames[0]];
  let rows=XLSX.utils.sheet_to_json(sheet,{defval:null}).slice(0,5000);
  rows=rows.map(row=>{for(const key in row)if(row[key] instanceof Date)row[key]=row[key].toISOString().slice(0,10);return row});
  if(!rows.length)throw new Error('empty');
  const cols=Object.keys(rows[0]);
  callback({id:uid(),name:file.name,cols,types:Object.fromEntries(cols.map(column=>[column,colType(rows,column)])),rows,owner:me.id})
 }catch(error){alert('Не удалось прочитать файл. Используйте CSV или XLSX с заголовками столбцов.')}};
 reader.readAsArrayBuffer(file)
}
function sampleDataset(){
 const months=['Янв','Фев','Мар','Апр','Май','Июн'],regions=['Север','Юг','Восток','Запад'],rows=[];
 months.forEach(month=>regions.forEach(region=>rows.push({Месяц:month,Регион:region,Продажи:Math.round(500+Math.random()*1500),Заказы:Math.round(20+Math.random()*80)})));
 const cols=Object.keys(rows[0]);return{id:uid(),name:'пример_продаж.csv',cols,types:Object.fromEntries(cols.map(column=>[column,colType(rows,column)])),rows,owner:me.id}
}
function aggregate(dataset,x,y,aggregation){
 const groups=new Map();dataset.rows.forEach(row=>{const label=String(row[x]??'—');if(!groups.has(label))groups.set(label,[]);groups.get(label).push(+row[y]||0)});
 return[...groups].slice(0,50).map(([label,values])=>[label,aggregation==='count'?values.length:aggregation==='avg'?values.reduce((sum,value)=>sum+value,0)/values.length:aggregation==='max'?Math.max(...values):values.reduce((sum,value)=>sum+value,0)])
}
function chartSeries(chart){
 const first=db.datasets.find(dataset=>dataset.id===chart.ds);if(!first)return[];
 const series=[{dataset:first,x:chart.x,y:chart.y,color:COLORS[0]}];
 if(chart.ds2){const second=db.datasets.find(dataset=>dataset.id===chart.ds2);if(second)series.push({dataset:second,x:chart.x2,y:chart.y2,color:COLORS[1]})}
 return series
}
function plottedValues(chart,series){
 if(chart.type==='scatter')return series.dataset.rows.filter(row=>isNum(row[series.x])&&isNum(row[series.y])).map(row=>({label:String(row[series.x]),value:+row[series.y]}));
 return aggregate(series.dataset,series.x,series.y,chart.agg).map(([label,value])=>({label,value}))
}
function outOfRange(chart){
 if(chart.min_value===null&&chart.max_value===null)return[];
 return chartSeries(chart).flatMap(series=>plottedValues(chart,series).flatMap(point=>{
  const alerts=[];
  if(chart.min_value!==null&&point.value<chart.min_value)alerts.push({series:series.dataset.name,label:point.label,value:point.value,direction:'below',limit:chart.min_value});
  if(chart.max_value!==null&&point.value>chart.max_value)alerts.push({series:series.dataset.name,label:point.label,value:point.value,direction:'above',limit:chart.max_value});
  return alerts
 }))
}
function chartConfig(chart){
 const series=chartSeries(chart);if(!series.length)return null;
 if(chart.type==='scatter')return{type:'scatter',data:{datasets:series.map(item=>({label:item.dataset.name,data:item.dataset.rows.filter(row=>isNum(row[item.x])&&isNum(row[item.y])).map(row=>({x:+row[item.x],y:+row[item.y]})),backgroundColor:item.color,borderColor:item.color}))},options:{locale:'ru-RU',maintainAspectRatio:false,scales:{x:{title:{display:true,text:series[0].x}},y:{title:{display:true,text:series[0].y}}},plugins:{legend:{display:series.length>1}}}};
 const pie=chart.type==='pie'||chart.type==='doughnut',aggregates=series.map(item=>aggregate(item.dataset,item.x,item.y,chart.agg));
 const labels=[...new Set(aggregates.flatMap(items=>items.map(item=>item[0])))].slice(0,100);
 const datasets=series.map((item,index)=>{const values=new Map(aggregates[index].map(([label,value])=>[label,value]));return{label:item.dataset.name,data:labels.map(label=>values.get(label)??null),backgroundColor:pie?labels.map((_,i)=>COLORS[i%COLORS.length]):item.color+'33',borderColor:pie?labels.map((_,i)=>COLORS[i%COLORS.length]):item.color,borderWidth:2,tension:.3,fill:false}});
 return{type:chart.type,data:{labels,datasets},options:{locale:'ru-RU',maintainAspectRatio:false,scales:pie?undefined:{y:{beginAtZero:true}},plugins:{legend:{display:pie||series.length>1}}}}
}
function draw(canvas,chart){const config=chartConfig(chart);if(config)instances.push(new Chart(canvas,config))}
function clearCharts(){instances.forEach(chart=>chart.destroy());instances=[]}

function render(){
 clearCharts();if(!me)return authView();
 const tabs=[['dash','Панель'],...(can('edit')?[['data','Наборы данных'],['build','Конструктор графиков']]:[]),...(can()?[['admin','Администрирование']]:[])];
 $('#app').innerHTML=`<header><b>InsightBoard</b><nav>${tabs.map(tab=>`<button class="${view===tab[0]?'on':''}" data-v="${tab[0]}">${tab[1]}</button>`).join('')}</nav><span class="sp"></span>
 <span class="mut">${esc(me.name)} <span class="tag">${ROLE_LABEL[me.role]||esc(me.role)}</span></span><button class="b g" id="lo">Выйти</button></header><main id="m"></main>`;
 document.querySelectorAll('nav button').forEach(button=>button.onclick=()=>{view=button.dataset.v;render()});
 $('#lo').onclick=()=>{me=null;token='';try{localStorage.removeItem('ib_t')}catch(error){}render()};
 ({dash:dashboardView,data:datasetsView,build:builderView,admin:adminView})[view]()
}

function dashboardView(){
 const main=$('#m');
 if(!db.charts.length&&!db.datasets.length){main.innerHTML=`<div class="card"><h3>Панель пока пуста</h3><p class="mut">${can('edit')?'Загрузите набор данных и создайте первый график.':'Попросите редактора или администратора добавить графики.'}</p></div>`;return}
 const alerts=db.charts.flatMap(chart=>outOfRange(chart).map(alert=>({...alert,title:chart.title})));
 main.innerHTML=`<div class="stats"><div class="card stat"><span>Наборы данных</span><strong>${db.datasets.length}</strong></div><div class="card stat"><span>Всего строк</span><strong>${db.datasets.reduce((sum,dataset)=>sum+dataset.rows.length,0).toLocaleString('ru-RU')}</strong></div><div class="card stat"><span>Столбцы данных</span><strong>${db.datasets.reduce((sum,dataset)=>sum+dataset.cols.length,0).toLocaleString('ru-RU')}</strong></div><div class="card stat"><span>Графики</span><strong>${db.charts.length}</strong></div></div>
 ${alerts.length?`<section class="card alert-card"><h2>⚠ Оповещения о выходе за границы (${alerts.length})</h2><ul>${alerts.slice(0,20).map(alert=>`<li>График «${esc(alert.title)}», ряд «${esc(alert.series)}», категория «${esc(alert.label)}»: значение ${fmt(alert.value)} ${alert.direction==='above'?'выше максимума':'ниже минимума'} ${fmt(alert.limit)}.</li>`).join('')}</ul>${alerts.length>20?`<p class="mut">Показаны первые 20 оповещений.</p>`:''}</section>`:''}
 ${db.charts.length?`<h2>Графики</h2><div class="grid" style="margin-bottom:20px">${db.charts.map(chart=>`<div class="card"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><b>${esc(chart.title)}</b>${can()||(can('edit')&&chart.owner===me.id)?`<button class="b d" data-chart-delete="${chart.id}">Удалить</button>`:''}</div><div class="cv"><canvas id="chart-${chart.id}"></canvas></div></div>`).join('')}</div>`:''}
 ${db.datasets.length?`<h2>Предпросмотр данных</h2><div class="grid">${db.datasets.map(dataset=>`<div class="card"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><b>${esc(dataset.name)}</b><span class="mut">${dataset.rows.length} строк · ${dataset.cols.length} столбцов</span></div><div class="sc dashboard-preview"><table><tr>${dataset.cols.map(column=>`<th>${esc(column)}</th>`).join('')}</tr>${dataset.rows.slice(0,5).map(row=>`<tr>${dataset.cols.map(column=>`<td>${esc(row[column])}</td>`).join('')}</tr>`).join('')}</table></div>${dataset.rows.length>5?`<p class="mut" style="margin-bottom:0">Показано 5 из ${dataset.rows.length} строк</p>`:''}</div>`).join('')}</div>`:''}
 ${!db.charts.length&&db.datasets.length?`<div class="card"><p class="mut" style="margin:0">Данные загружены. Создайте график в конструкторе, чтобы он появился на панели.</p></div>`:''}`;
 db.charts.forEach(chart=>draw($('#chart-'+chart.id),chart));
 main.querySelectorAll('[data-chart-delete]').forEach(button=>button.onclick=async()=>{await api('DELETE','/api/charts/'+button.dataset.chartDelete);await refresh();render()})
}

function datasetsView(){
 const main=$('#m');
 main.innerHTML=`<div class="card"><h3>Загрузить набор данных</h3><div class="row"><input type="file" id="file" accept=".csv,.xlsx,.xls"><button class="b g" id="sample">Загрузить пример данных</button></div><p class="mut hint">Поддерживаются CSV и Excel (.xlsx, .xls), до 5000 строк в файле.</p></div>
 ${db.datasets.map(dataset=>`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><b>${esc(dataset.name)}</b><span class="mut">${dataset.rows.length} строк · ${dataset.cols.length} столбцов</span>${can()||dataset.owner===me.id?`<button class="b d" data-dataset-delete="${dataset.id}">Удалить</button>`:''}</div>
 <p class="mut">${dataset.cols.map(column=>`${esc(column)} <span class="tag">${esc(dataset.types[column])}</span>`).join(' ')}</p>
 <div class="sc"><table><tr>${dataset.cols.map(column=>`<th>${esc(column)}</th>`).join('')}</tr>${dataset.rows.slice(0,5).map(row=>`<tr>${dataset.cols.map(column=>`<td>${esc(row[column])}</td>`).join('')}</tr>`).join('')}</table></div></div>`).join('')}`;
 $('#file').onchange=event=>{const file=event.target.files[0];if(file)parseFile(file,async dataset=>{await api('POST','/api/datasets',dataset);await refresh();render()})};
 $('#sample').onclick=async()=>{await api('POST','/api/datasets',sampleDataset());await refresh();render()};
 main.querySelectorAll('[data-dataset-delete]').forEach(button=>button.onclick=async()=>{await api('DELETE','/api/datasets/'+button.dataset.datasetDelete);await refresh();render()})
}

function selectField(id,label,options,value){return`<div class="field"><label>${label}</label><select id="${id}">${options.map(option=>`<option value="${esc(option[0])}" ${option[0]===value?'selected':''}>${esc(option[1])}</option>`).join('')}</select></div>`}
function builderView(){
 const main=$('#m');if(!db.datasets.length){main.innerHTML='<div class="card">Сначала загрузите набор данных во вкладке «Наборы данных».</div>';return}
 if(!db.datasets.some(dataset=>dataset.id===builder.ds))builder.ds=db.datasets[0].id;
 let dataset=db.datasets.find(item=>item.id===builder.ds);
 if(builder.ds2===builder.ds||!db.datasets.some(item=>item.id===builder.ds2))builder.ds2='';
 if(!dataset.cols.includes(builder.x))builder.x=dataset.cols[0];
 if(!dataset.cols.includes(builder.y))builder.y=dataset.cols.find(column=>dataset.types[column]==='number')||dataset.cols[0];
 const canCompare=['bar','line','scatter'].includes(builder.type);
 if(!canCompare)builder.ds2='';
 const comparison=builder.ds2?db.datasets.find(item=>item.id===builder.ds2):null;
 if(comparison){if(!comparison.cols.includes(builder.x2))builder.x2=comparison.cols[0];if(!comparison.cols.includes(builder.y2))builder.y2=comparison.cols.find(column=>comparison.types[column]==='number')||comparison.cols[0]}
 const datasetOptions=db.datasets.map(item=>[item.id,item.name]);
 const typeOptions=Object.entries(TYPE_LABEL),aggOptions=Object.entries(AGG_LABEL);
 main.innerHTML=`<div class="card"><div class="form-grid">
 ${selectField('ds','Основной набор данных',datasetOptions,builder.ds)}
 ${selectField('type','Тип графика',typeOptions,builder.type)}
 ${selectField('x','Столбец X (категория)',dataset.cols.map(column=>[column,column]),builder.x)}
 ${selectField('y','Столбец Y (значение)',dataset.cols.map(column=>[column,column]),builder.y)}
 ${selectField('agg','Способ расчёта',aggOptions,builder.agg)}
 ${canCompare?selectField('ds2','Сравнить с набором данных',[["",'Без сравнения'],...db.datasets.filter(item=>item.id!==dataset.id).map(item=>[item.id,item.name])],builder.ds2):''}
 ${comparison?selectField('x2','Столбец X второго набора',comparison.cols.map(column=>[column,column]),builder.x2):''}
 ${comparison?selectField('y2','Столбец Y второго набора',comparison.cols.map(column=>[column,column]),builder.y2):''}
 </div><div class="thresholds">
 <div class="field"><label for="min">Нижняя граница оповещения</label><input type="number" step="any" id="min" value="${esc(builder.min_value)}" placeholder="Не задана"></div>
 <div class="field"><label for="max">Верхняя граница оповещения</label><input type="number" step="any" id="max" value="${esc(builder.max_value)}" placeholder="Не задана"></div>
 </div><p class="mut hint">На панели появится оповещение, если значение графика выйдет за заданные границы.</p></div>
 <div class="card"><div class="cv"><canvas id="preview"></canvas></div><div class="row" style="margin-top:12px"><div class="field" style="flex:1"><label for="title">Название графика</label><input id="title" style="width:100%" value="${esc(builder.title)}" placeholder="Например: Продажи по месяцам"></div><button class="b" id="save">Добавить на панель</button></div></div>`;
 ['ds','type','x','y','agg','ds2','x2','y2'].forEach(key=>{const control=$('#'+key);if(control)control.onchange=event=>{builder[key]=event.target.value;if(key==='ds'){builder.x='';builder.y='';if(builder.ds2===builder.ds)builder.ds2=''}if(key==='ds2'){builder.x2='';builder.y2=''}if(key==='type'&&!['bar','line','scatter'].includes(builder.type))builder.ds2='';builderView()}});
 $('#min').oninput=event=>builder.min_value=event.target.value;
 $('#max').oninput=event=>builder.max_value=event.target.value;
 $('#title').oninput=event=>builder.title=event.target.value;
 draw($('#preview'),builder);
 $('#save').onclick=async()=>{
  const title=builder.title.trim()||`${AGG_LABEL[builder.agg]}: ${builder.y} по ${builder.x}`;
  await api('POST','/api/charts',{title,type:builder.type,ds:builder.ds,x:builder.x,y:builder.y,agg:builder.agg,ds2:builder.ds2||null,x2:builder.x2,y2:builder.y2,min_value:builder.min_value===''?null:Number(builder.min_value),max_value:builder.max_value===''?null:Number(builder.max_value)});
  builder.title='';await refresh();view='dash';render()
 }
}

function adminView(){
 const main=$('#m');
 main.innerHTML=`<div class="card"><h3>Добавить пользователя</h3><div class="form-grid">
 <div class="field"><label for="new-name">Имя пользователя</label><input id="new-name" maxlength="40" placeholder="Не менее 2 символов"></div>
 <div class="field"><label for="new-pass">Пароль</label><input id="new-pass" type="password" maxlength="200" placeholder="Не менее 4 символов"></div>
 ${selectField('new-role','Роль',[['admin',ROLE_LABEL.admin],['editor',ROLE_LABEL.editor],['viewer',ROLE_LABEL.viewer]],'editor')}
 </div><button class="b" id="add-user" style="margin-top:12px">Создать пользователя</button></div>
 <div class="card"><h3>Пользователи и роли</h3><div class="sc"><table><tr><th>Пользователь</th><th>Роль</th><th>Действия</th></tr>${db.users.map(user=>`<tr><td>${esc(user.name)}</td><td><select data-role="${user.id}" ${user.id===me.id?'disabled':''}>${Object.entries(ROLE_LABEL).map(([role,label])=>`<option value="${role}" ${user.role===role?'selected':''}>${label}</option>`).join('')}</select></td><td>${user.id===me.id?'—':`<button class="b d" data-user-delete="${user.id}">Удалить</button>`}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Сводка</h3><p class="mut">${db.users.length} пользователей · ${db.datasets.length} наборов данных · ${db.charts.length} графиков</p>
 <p class="mut"><b>Администратор</b>: полный доступ · <b>Редактор</b>: загрузка данных и создание графиков · <b>Наблюдатель</b>: просмотр панели</p></div>`;
 $('#add-user').onclick=async()=>{await api('POST','/api/users',{name:$('#new-name').value.trim(),pass:$('#new-pass').value,role:$('#new-role').value});await refresh();render()};
 main.querySelectorAll('[data-role]').forEach(select=>select.onchange=async()=>{await api('PUT','/api/users/'+select.dataset.role,{role:select.value});await refresh();render()});
 main.querySelectorAll('[data-user-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('Удалить этого пользователя?'))return;await api('DELETE','/api/users/'+button.dataset.userDelete);await refresh();render()})
}

boot();
</script>
</body>
</html>
